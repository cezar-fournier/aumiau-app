name: Build iOS and publish to TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Assinar e enviar o build ao TestFlight'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  ios:
    name: Validate, build and optionally publish iOS
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select supported Xcode
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib test

      - name: Test
        run: flutter test

      - name: Build unsigned iOS candidate
        if: ${{ !inputs.upload_to_testflight }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: \([0-9][0-9.]*\).*/\1/p' pubspec.yaml)"
          test -n "$version"
          flutter build ios \
            --release \
            --no-codesign \
            --build-name="$version" \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define=AUMIAU_API_BASE_URL=https://aumiau.app.br/ \
            --dart-define=AUMIAU_APP_VERSION="$version"

      - name: Validate TestFlight secrets
        if: ${{ inputs.upload_to_testflight }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          required=(
            APPLE_TEAM_ID
            APP_STORE_CONNECT_KEY_ID
            APP_STORE_CONNECT_ISSUER_ID
            APP_STORE_CONNECT_API_KEY_BASE64
            IOS_DISTRIBUTION_CERTIFICATE_BASE64
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
            IOS_PROVISIONING_PROFILE_BASE64
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret $name não configurado no repositório privado."
              exit 1
            fi
          done

      - name: Configure App Store signing
        if: ${{ inputs.upload_to_testflight }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/aumiau-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          certificate="$RUNNER_TEMP/aumiau-distribution.p12"
          profile="$RUNNER_TEMP/aumiau-appstore.mobileprovision"
          profile_plist="$RUNNER_TEMP/aumiau-profile.plist"
          api_keys_dir="$HOME/.appstoreconnect/private_keys"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          mkdir -p "$api_keys_dir" "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode \
            > "$api_keys_dir/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$api_keys_dir/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

          security cms -D -i "$profile" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"

          if [[ "$profile_team" != "$APPLE_TEAM_ID" ]]; then
            echo "::error::O perfil pertence a outra equipe Apple."
            exit 1
          fi
          if [[ "$profile_app_id" != "$APPLE_TEAM_ID.br.com.cainformatica.aumiau" ]]; then
            echo "::error::O perfil não pertence ao Bundle ID br.com.cainformatica.aumiau."
            exit 1
          fi

          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "IOS_KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"

      - name: Configure Xcode team
        if: ${{ inputs.upload_to_testflight }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('ios/Runner.xcodeproj/project.pbxproj')
          text = path.read_text()
          team = os.environ['APPLE_TEAM_ID']
          profile = os.environ['IOS_PROFILE_NAME']
          marker = 'PRODUCT_BUNDLE_IDENTIFIER = br.com.cainformatica.aumiau;'
          if marker not in text:
              raise SystemExit('Bundle ID principal não encontrado no projeto Xcode.')
          signing = (
              'CODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\t'
              'CODE_SIGN_STYLE = Manual;\n\t\t\t\t'
              f'DEVELOPMENT_TEAM = {team};\n\t\t\t\t'
              f'PROVISIONING_PROFILE_SPECIFIER = "{profile}";\n\t\t\t\t'
          )
          text = text.replace(marker, signing + marker)
          path.write_text(text)
          PY

      - name: Create export configuration
        if: ${{ inputs.upload_to_testflight }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>br.com.cainformatica.aumiau</key>
              <string>${IOS_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Build signed IPA
        if: ${{ inputs.upload_to_testflight }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: \([0-9][0-9.]*\).*/\1/p' pubspec.yaml)"
          test -n "$version"
          flutter build ipa \
            --release \
            --build-name="$version" \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            --dart-define=AUMIAU_API_BASE_URL=https://aumiau.app.br/ \
            --dart-define=AUMIAU_APP_VERSION="$version"

      - name: Validate IPA
        if: ${{ inputs.upload_to_testflight }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          ipa="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -s "$ipa"
          xcrun altool --validate-app \
            --file "$ipa" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          ipa="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          xcrun altool --upload-app \
            --file "$ipa" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload IPA artifact
        if: ${{ inputs.upload_to_testflight }}
        uses: actions/upload-artifact@v4
        with:
          name: aumiau-ios-${{ github.run_number }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing material
        if: ${{ always() && inputs.upload_to_testflight }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          security delete-keychain "$IOS_KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${IOS_PROFILE_UUID}.mobileprovision"
          rm -f "$RUNNER_TEMP/aumiau-distribution.p12" "$RUNNER_TEMP/aumiau-appstore.mobileprovision"
