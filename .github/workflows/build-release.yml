name: Build and publish AuMiau release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib test

      - name: Test
        run: flutter test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Test backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
          JWT_SECRET: ci-only-secret-not-used-in-production
        run: |
          python -m pip install -r requirements-dev.txt
          python -m compileall -q app scripts
          python -m pytest -q

      - name: Audit Python dependencies
        working-directory: backend
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt

      - name: Validate production signing secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret $name não configurado. Releases versionadas exigem assinatura Android de produção."
              exit 1
            fi
          done

      - name: Configure Android production signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aumiau-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/aumiau-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build release APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == "$GITHUB_REF_NAME" ]]; then
            version="0.1.0"
          fi
          build_number="$(sed -n 's/^version: .*+//p' pubspec.yaml)"
          if [[ ! "$build_number" =~ ^[0-9]+$ ]]; then
            echo "Código de versão Android inválido no pubspec.yaml: $build_number" >&2
            exit 1
          fi
          common_args=(
            "--release"
            "--build-name=$version"
            "--build-number=$build_number"
            "--dart-define=AUMIAU_API_BASE_URL=https://aumiau.app.br/"
            "--dart-define=AUMIAU_APP_VERSION=$version"
            "--dart-define=AUMIAU_DISTRIBUTION=direct"
          )
          flutter build appbundle "${common_args[@]}"
          flutter build apk "${common_args[@]}"
          cp build/app/outputs/bundle/release/app-release.aab \
            "build/app/outputs/bundle/release/aumiau-${GITHUB_REF_NAME}.aab"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/aumiau-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/aumiau-latest.apk"

      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: build/aumiau-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aumiau-release-${{ github.ref_name }}
          path: |
            build/app/outputs/bundle/release/aumiau-${{ github.ref_name }}.aab
            build/app/outputs/flutter-apk/aumiau-${{ github.ref_name }}.apk
            build/app/outputs/flutter-apk/aumiau-latest.apk
            build/aumiau-${{ github.ref_name }}.spdx.json
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/app/outputs/bundle/release/aumiau-${GITHUB_REF_NAME}.aab" \
            "build/app/outputs/flutter-apk/aumiau-${GITHUB_REF_NAME}.apk" \
            "build/app/outputs/flutter-apk/aumiau-latest.apk" \
            "build/aumiau-${GITHUB_REF_NAME}.spdx.json" \
            --title "AuMiau $GITHUB_REF_NAME" \
            --generate-notes

      - name: Remove signing material
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/aumiau-release.jks"
