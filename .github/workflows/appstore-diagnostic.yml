name: Diagnose App Store Connect upload

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operação no App Store Connect'
        required: true
        type: choice
        default: diagnose
        options:
          - diagnose
          - create_external_group
      external_group_name:
        description: 'Nome do grupo externo'
        required: false
        type: string
        default: 'AuMiau — Beta Externo'
      build_number:
        description: 'Número do build iOS que será associado'
        required: false
        type: string
        default: '6'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install JWT dependency
        run: python3 -m pip install --disable-pip-version-check --quiet 'PyJWT[crypto]==2.10.1'

      - name: Query AuMiau build uploads
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          OPERATION: ${{ inputs.operation }}
          EXTERNAL_GROUP_NAME: ${{ inputs.external_group_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.parse
          import urllib.error
          import urllib.request

          import jwt

          key_id = os.environ['APP_STORE_CONNECT_KEY_ID']
          issuer_id = os.environ['APP_STORE_CONNECT_ISSUER_ID']
          private_key = base64.b64decode(
              os.environ['APP_STORE_CONNECT_API_KEY_BASE64']
          )
          now = int(time.time())
          token = jwt.encode(
              {
                  'iss': issuer_id,
                  'iat': now - 10,
                  'exp': now + 600,
                  'aud': 'appstoreconnect-v1',
              },
              private_key,
              algorithm='ES256',
              headers={'kid': key_id, 'typ': 'JWT'},
          )

          def get(path, parameters=None):
              url = 'https://api.appstoreconnect.apple.com' + path
              if parameters:
                  url += '?' + urllib.parse.urlencode(parameters, doseq=True)
              request = urllib.request.Request(
                  url,
                  headers={'Authorization': f'Bearer {token}'},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode('utf-8', errors='replace')
                  raise RuntimeError(
                      f'App Store Connect respondeu HTTP {error.code}: {detail}'
                  ) from error

          def post(path, payload):
              url = 'https://api.appstoreconnect.apple.com' + path
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode('utf-8'),
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                  },
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  detail = error.read().decode('utf-8', errors='replace')
                  raise RuntimeError(
                      f'App Store Connect respondeu HTTP {error.code}: {detail}'
                  ) from error

          apps = get('/v1/apps', {'filter[bundleId]': 'br.com.cainformatica.aumiau'})
          if len(apps.get('data', [])) != 1:
              raise SystemExit(
                  f"Esperado um app; encontrados {len(apps.get('data', []))}."
              )
          app_id = apps['data'][0]['id']
          print('App encontrado: br.com.cainformatica.aumiau')

          uploads = get(
              f'/v1/apps/{app_id}/buildUploads',
              {
                  'sort': '-uploadedDate',
                  'limit': '10',
                  'fields[buildUploads]': ','.join([
                      'cfBundleShortVersionString',
                      'cfBundleVersion',
                      'createdDate',
                      'uploadedDate',
                      'state',
                      'platform',
                  ]),
              },
          )
          print(f"Uploads encontrados: {len(uploads.get('data', []))}")
          for upload in uploads.get('data', []):
              attributes = upload.get('attributes', {})
              print(json.dumps({
                  'version': attributes.get('cfBundleShortVersionString'),
                  'build': attributes.get('cfBundleVersion'),
                  'platform': attributes.get('platform'),
                  'createdDate': attributes.get('createdDate'),
                  'uploadedDate': attributes.get('uploadedDate'),
                  'state': attributes.get('state'),
              }, ensure_ascii=False, sort_keys=True))

          builds = get(
              '/v1/builds',
              {
                  'filter[app]': app_id,
                  'sort': '-uploadedDate',
                  'limit': '10',
                  'fields[builds]': ','.join([
                      'version',
                      'uploadedDate',
                      'processingState',
                      'minOsVersion',
                      'usesNonExemptEncryption',
                  ]),
              },
          )
          print(f"Builds processados encontrados: {len(builds.get('data', []))}")
          for build in builds.get('data', []):
              attributes = build.get('attributes', {})
              print(json.dumps({
                  'build': attributes.get('version'),
                  'uploadedDate': attributes.get('uploadedDate'),
                  'processingState': attributes.get('processingState'),
                  'minOsVersion': attributes.get('minOsVersion'),
                  'usesNonExemptEncryption': attributes.get('usesNonExemptEncryption'),
              }, ensure_ascii=False, sort_keys=True))

          if os.environ.get('OPERATION', 'diagnose') != 'create_external_group':
              raise SystemExit(0)

          group_name = os.environ.get('EXTERNAL_GROUP_NAME', '').strip()
          build_number = os.environ.get('BUILD_NUMBER', '').strip()
          if not group_name:
              raise SystemExit('O nome do grupo externo não pode ficar vazio.')
          if not build_number:
              raise SystemExit('O número do build não pode ficar vazio.')

          groups = get(
              '/v1/betaGroups',
              {
                  'filter[app]': app_id,
                  'filter[name]': group_name,
                  'filter[isInternalGroup]': 'false',
                  'limit': '10',
              },
          )
          matching_groups = groups.get('data', [])
          if len(matching_groups) > 1:
              raise SystemExit(
                  f'Foram encontrados {len(matching_groups)} grupos externos com o mesmo nome.'
              )

          if matching_groups:
              group_id = matching_groups[0]['id']
              print(f'Grupo externo já existente: {group_name}')
          else:
              created_group = post(
                  '/v1/betaGroups',
                  {
                      'data': {
                          'type': 'betaGroups',
                          'attributes': {
                              'name': group_name,
                              'isInternalGroup': False,
                              'feedbackEnabled': True,
                          },
                          'relationships': {
                              'app': {
                                  'data': {
                                      'type': 'apps',
                                      'id': app_id,
                                  },
                              },
                          },
                      },
                  },
              )
              group_id = created_group['data']['id']
              print(f'Grupo externo criado: {group_name}')

          selected_builds = [
              build for build in builds.get('data', [])
              if build.get('attributes', {}).get('version') == build_number
              and build.get('attributes', {}).get('processingState') == 'VALID'
          ]
          if len(selected_builds) != 1:
              raise SystemExit(
                  f'Esperado um build válido com número {build_number}; '
                  f'encontrados {len(selected_builds)}.'
              )
          build_id = selected_builds[0]['id']

          linked_builds = get(
              f'/v1/betaGroups/{group_id}/relationships/builds',
              {'limit': '200'},
          )
          linked_ids = {item['id'] for item in linked_builds.get('data', [])}
          if build_id in linked_ids:
              print(f'Build {build_number} já associado ao grupo externo.')
          else:
              post(
                  f'/v1/betaGroups/{group_id}/relationships/builds',
                  {
                      'data': [
                          {
                              'type': 'builds',
                              'id': build_id,
                          },
                      ],
                  },
              )
              print(f'Build {build_number} associado ao grupo externo.')

          print('Criação idempotente do grupo externo concluída.')
          PY
