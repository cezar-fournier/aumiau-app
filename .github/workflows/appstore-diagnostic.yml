name: Diagnose App Store Connect upload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install JWT dependency
        run: python3 -m pip install --disable-pip-version-check --quiet 'PyJWT[crypto]==2.10.1'

      - name: Query AuMiau build uploads
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.parse
          import urllib.error
          import urllib.request

          import jwt

          key_id = os.environ['APP_STORE_CONNECT_KEY_ID']
          issuer_id = os.environ['APP_STORE_CONNECT_ISSUER_ID']
          private_key = base64.b64decode(
              os.environ['APP_STORE_CONNECT_API_KEY_BASE64']
          )
          now = int(time.time())
          token = jwt.encode(
              {
                  'iss': issuer_id,
                  'iat': now - 10,
                  'exp': now + 600,
                  'aud': 'appstoreconnect-v1',
              },
              private_key,
              algorithm='ES256',
              headers={'kid': key_id, 'typ': 'JWT'},
          )

          def get(path, parameters=None):
              url = 'https://api.appstoreconnect.apple.com' + path
              if parameters:
                  url += '?' + urllib.parse.urlencode(parameters, doseq=True)
              request = urllib.request.Request(
                  url,
                  headers={'Authorization': f'Bearer {token}'},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode('utf-8', errors='replace')
                  raise RuntimeError(
                      f'App Store Connect respondeu HTTP {error.code}: {detail}'
                  ) from error

          apps = get('/v1/apps', {'filter[bundleId]': 'br.com.cainformatica.aumiau'})
          if len(apps.get('data', [])) != 1:
              raise SystemExit(
                  f"Esperado um app; encontrados {len(apps.get('data', []))}."
              )
          app_id = apps['data'][0]['id']
          print('App encontrado: br.com.cainformatica.aumiau')

          uploads = get(
              f'/v1/apps/{app_id}/buildUploads',
              {
                  'sort': '-uploadedDate',
                  'limit': '10',
                  'fields[buildUploads]': ','.join([
                      'cfBundleShortVersionString',
                      'cfBundleVersion',
                      'createdDate',
                      'uploadedDate',
                      'state',
                      'platform',
                  ]),
              },
          )
          print(f"Uploads encontrados: {len(uploads.get('data', []))}")
          for upload in uploads.get('data', []):
              attributes = upload.get('attributes', {})
              print(json.dumps({
                  'version': attributes.get('cfBundleShortVersionString'),
                  'build': attributes.get('cfBundleVersion'),
                  'platform': attributes.get('platform'),
                  'createdDate': attributes.get('createdDate'),
                  'uploadedDate': attributes.get('uploadedDate'),
                  'state': attributes.get('state'),
              }, ensure_ascii=False, sort_keys=True))

          builds = get(
              '/v1/builds',
              {
                  'filter[app]': app_id,
                  'sort': '-uploadedDate',
                  'limit': '10',
                  'fields[builds]': ','.join([
                      'version',
                      'uploadedDate',
                      'processingState',
                      'minOsVersion',
                      'usesNonExemptEncryption',
                  ]),
              },
          )
          print(f"Builds processados encontrados: {len(builds.get('data', []))}")
          for build in builds.get('data', []):
              attributes = build.get('attributes', {})
              print(json.dumps({
                  'build': attributes.get('version'),
                  'uploadedDate': attributes.get('uploadedDate'),
                  'processingState': attributes.get('processingState'),
                  'minOsVersion': attributes.get('minOsVersion'),
                  'usesNonExemptEncryption': attributes.get('usesNonExemptEncryption'),
              }, ensure_ascii=False, sort_keys=True))
          PY
